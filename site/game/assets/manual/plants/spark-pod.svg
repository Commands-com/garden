    <path d="M18 14 L20 18 L16 18 Z"/>
    <path d="M30 14 L28 18 L32 18 Z"/>
    <path d="M36 22 L31 24 L33 20 Z"/>
    <path d="M32 32 L28 29 L33 28 Z"/>
    <path d="M16 32 L20 29 L15 28 Z"/>
    <path d="M12 22 L17 24 L15 20 Z"/>
  </g>

  <path d="M16 37 C13 40 12 43 13 46" fill="none" stroke="#2a4d70" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M32 37 C35 40 36 43 35 46" fill="none" stroke="#2a4d70" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M24 38 C24 41 24 44 24 46" fill="none" stroke="#142a40" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18 18 C21 16 27 16 30 18" fill="none" stroke="#eaffff" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
